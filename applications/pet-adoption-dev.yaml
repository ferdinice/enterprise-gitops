apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pet-adoption-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ferdinice/enterprise-gitops.git
    targetRevision: main
    path: pet-adoption/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true